# Render "Blueprint": tells Render how to run the API for free.
# Render dashboard -> New -> Blueprint -> pick your GitHub repo.
# (The website itself goes on Vercel, see README.)
databases:
  - name: talentiq-db
    plan: free              # free Postgres: 1 GB, expires after 30 days
    databaseName: talentiq
    user: talentiq

services:
  - type: web
    name: talentiq-api
    runtime: python
    plan: free              # sleeps after 15 min idle; first request takes ~1 min
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render creates a strong random value once
      - key: DJANGO_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: talentiq-db
          property: connectionString
      - key: MISTRAL_API_KEY
        sync: false                  # you paste it in the Render dashboard; never commit it
      - key: MISTRAL_MODEL
        value: codestral-2508
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # paste your Vercel URL, e.g. https://talentiq.vercel.app
      - key: KEY_ENCRYPTION_KEY
        sync: false                  # a Fernet key you generate (see README); never commit it
      - key: NUM_PROXIES
        value: "1"                   # Render has 1 proxy in front (used by the upload limiter)
