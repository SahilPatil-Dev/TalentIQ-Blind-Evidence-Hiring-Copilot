# Runs the whole app locally with one command:  docker compose up --build
#   website  -> http://localhost:3000
#   API      -> http://localhost:8000/api/
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentiq
      POSTGRES_USER: talentiq
      POSTGRES_PASSWORD: talentiq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentiq -d talentiq"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-only-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-}
      DATABASE_URL: postgres://talentiq:talentiq@db:5432/talentiq
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-codestral-2508}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
